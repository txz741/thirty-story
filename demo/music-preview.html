<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>四段回忆 · 背景音乐试听</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4eef7;color:#6f5779;font:14px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:640px;margin:auto;padding:30px 20px}h1{font:400 27px/1.6 "Songti SC",SimSun,serif}p,small{color:#99829f}.panel{border:1px solid #e1d3e8;border-radius:18px;padding:18px;margin:18px 0;background:#fffcf8}button{font:inherit;color:#735280;background:#e9ddf1;border:1px solid #d7c0e1;border-radius:10px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap}label{display:flex;justify-content:space-between;margin-top:15px}input{width:100%;accent-color:#b192c3}.status{white-space:pre-wrap;display:block;font-size:13px;min-height:115px}a{color:#8c659f}ol{padding-left:21px;font-size:12px}small{display:block;font-size:11px}</style></head>
<body><main><h1>四段回忆，连续播放</h1><p>按顺序模拟故事首次前进。回看、重复进入、静音恢复都应保持当前音乐进度。</p><section class="panel"><div class="buttons"><button data-stage="1">进入主路 · BGM 1</button><button data-stage="2">第4事件 Wink 后 · BGM 2</button><button data-stage="3">第7事件 Wink 后 · BGM 3</button><button id="redlight">红灯第4幕 · 淡出BGM3</button><button data-stage="4">乘风之翼出现 · BGM 4</button></div><p><button id="back">模拟回看前一章节</button> <button id="repeat">再次进入当前章节</button></p><output id="status" class="status" aria-live="polite">请轻触“进入主路”，开启音乐。</output></section>
<section class="panel"><div class="buttons"><button id="mute">静音全部</button><button id="effect">试听发现音效</button><button id="reset">重置试听</button></div><label for="bgm">背景音乐 <output id="bgm-value">22%</output></label><input id="bgm" type="range" min="0" max="100" value="22"><label for="sfx">音效 <output id="sfx-value">80%</output></label><input id="sfx" type="range" min="0" max="100" value="80"></section>
<small>BGM 1–3 循环，BGM 4 只播放一次，末尾渐弱，结束后保持静音。音乐需在真实触摸后解锁；若未听到，请再次点声音按钮。此页独立试听，不改变绘本进度。</small><ol id="files"></ol><p><a href="./?v=22">返回完整绘本</a> · <a href="audio-preview.html?v=22">六个音效试听</a></p></main>
