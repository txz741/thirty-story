<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eff8"><meta name="robots" content="noindex,nofollow">
<title>乘风去往回忆里 · 音效试听</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eff8;color:#67516f;font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:680px;margin:auto;padding:32px 20px 50px}h1{font:500 27px/1.5 "Songti SC",SimSun,serif;margin:0 0 10px}p{color:#99839f;font-size:13px}a{color:#946da8}.panel,.sound{background:#fffcf8;border:1px solid #e4d8ea;border-radius:17px;padding:18px;margin:15px 0}button{font:inherit;font-size:13px;cursor:pointer;background:#e9dcf1;border:1px solid #d6c0e1;color:#745285;border-radius:10px;padding:10px 15px}button:disabled{opacity:.4}.buttons{display:flex;flex-wrap:wrap;gap:8px}label{display:flex;align-items:center;justify-content:space-between;margin:18px 0 5px;font-size:13px}input[type=range]{width:100%;accent-color:#b596c6}input[type=file]{max-width:100%;font-size:12px}.sound h2{font-size:17px;margin:0}.sound p{margin:4px 0 12px}.sound.active{border-color:#c6a4d4;box-shadow:0 0 15px #d2b6de38}.sound a{font-size:12px;margin-left:15px}.status{white-space:pre-wrap;font-size:12px;line-height:1.8;color:#8d7498;margin-top:15px}small{display:block;font-size:11px;color:#a18ca7}.duration{float:right;font-size:12px;color:#ac96b0}button:focus-visible{outline:2px solid #b68ac9;outline-offset:3px}
</style>
</head>
<body><main>
<h1>听见，回忆里的小小星光</h1>
<p>六个原创代码合成音效。建议先调低设备音量，再逐个试听。</p>
<section class="panel" aria-label="试听控制">
  <div class="buttons"><button id="enable" type="button">开启声音／播放自检</button><button id="mute" type="button">静音全部</button><button id="play-all" type="button">按顺序试听六个音效</button><button id="stop" type="button">停止试听</button></div>
  <label for="sfx-volume">音效音量 <output id="sfx-value">80%</output></label><input id="sfx-volume" type="range" min="0" max="100" value="80">
  <label for="bgm-volume">背景音乐音量 <output id="bgm-value">22%</output></label><input id="bgm-volume" type="range" min="0" max="100" value="22">
  <label for="bgm-file">可选：本机音乐混音测试</label><input id="bgm-file" type="file" accept="audio/*"><small>仅在当前设备播放，不上传文件。绘本目前只播放音效。</small>
  <output id="status" class="status" aria-live="polite">请轻触上方按钮，开启浏览器声音。</output>
</section>
<div id="sounds"></div>
<p><a href="./?v=14">返回互动绘本</a> · <a href="assets/audio/manifest.json">音效参数与制作记录</a></p>
<small>自检会确认本机音频解锁、文件解码和播放调度；是否从扬声器听到声音，仍需你实际试听确认。</small>
</main>
<script type="importmap">
{
  "imports": {
    "./src/audio-system.js": "./src/audio-system.js?v=14",
    "./src/audio-config.js": "./src/audio-config.js?v=14",
    "./src/bgm-player.js": "./src/bgm-player.js?v=14",
    "./src/music-manager.js": "./src/music-manager.js?v=14",
    "./src/music-config.js": "./src/music-config.js?v=14",
    "./src/asset-loader.js": "./src/asset-loader.js?v=14"
  }
}
</script>
<script type="module" src="src/audio-preview.js?v=14"></script>
</body></html>
