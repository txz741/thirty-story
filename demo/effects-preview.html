<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>勋章与终章 · 动画预览</title><link rel="stylesheet" href="styles.css?v=13">
<style>body{display:flex;flex-direction:column;background:#eee7f2}header{width:min(100%,550px);padding:10px 12px;color:#796183;font-size:12px;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}header button,header select{font:inherit;color:inherit;background:#fffaf4;border:1px solid #d9c6e2;border-radius:8px;padding:7px}header a{color:inherit}.preview-stage{height:calc(100svh - 108px);width:min(100vw,calc((100svh - 108px) * 9 / 16));flex-shrink:0}.preview-art{position:absolute;inset:10% 4% 18%;width:92%;height:72%;object-fit:contain}.preview-stage .character-box{height:58%;bottom:10%}.preview-stage .flying-badge{z-index:6}footer{font-size:11px;color:#9a85a2;padding:6px;text-align:center}.preview-stage:not(.badge-scene) .character-box{display:none}</style></head>
<body><header><select id="scene" aria-label="选择动画"><option value="badge">三秒柔光收藏</option><option value="0">最后一枚勋章</option><option value="1">包中回忆飞出</option><option value="2" selected>汇聚与环绕</option></select><label><input id="with-if" type="checkbox">包含 IF</label><button id="replay" type="button">重新播放</button><button id="pause" type="button">暂停</button><button id="mute" type="button">静音</button><a href="./?v=13">返回绘本</a></header>
<main id="preview-stage" class="book preview-stage"><img id="preview-art" class="preview-art" alt="终章背景"><div class="character-box"><img id="preview-character" src="assets/expect.png" alt="期待收藏回忆"></div><img id="preview-badge" class="flying-badge" src="assets/badges/graduation.png" alt="毕业勋章" hidden><div id="preview-overlay" class="finale-overlay"></div></main><footer id="preview-note">先展示中心勋章，再由下方飞入，最后缓缓环绕。轻触“重新播放”开启声音。</footer>
<script type="importmap">
{
  "imports": {
    "./src/finale.js": "./src/finale.js?v=13",
    "./src/journey-data.js": "./src/journey-data.js?v=13",
    "./src/badge-presentation.js": "./src/badge-presentation.js?v=13",
    "./src/badge-animation.js": "./src/badge-animation.js?v=13",
    "./src/audio-system.js": "./src/audio-system.js?v=13",
    "./src/audio-config.js": "./src/audio-config.js?v=13",
    "./src/bgm-player.js": "./src/bgm-player.js?v=13",
    "./src/music-manager.js": "./src/music-manager.js?v=13",
    "./src/music-config.js": "./src/music-config.js?v=13",
    "./src/asset-loader.js": "./src/asset-loader.js?v=13",
    "./src/offline-app.js": "./src/offline-app.js?v=13",
    "./src/offline-cache.js": "./src/offline-cache.js?v=13"
  }
}
</script><script type="module" src="src/effects-preview.js?v=13"></script></body></html>
