<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3edf7">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="走过十段日常，收藏一路回忆。一本可以滑动翻阅的生活绘本。">
  <title>乘风去往回忆里</title>
  <link rel="stylesheet" href="styles.css?v=21">
  <link rel="stylesheet" href="chapter-road.css?v=21">
  <link rel="preload" href="assets/cover.jpg" as="image">
</head>
<body>
  <main id="book" class="book" aria-label="乘风去往回忆里，滑动翻页绘本">
    <section id="cover" class="cover layer">
      <div class="cover-wash" aria-hidden="true"></div>
      <header class="cover-heading"><p>一本关于日子与回忆的绘本</p><h1>乘风去往回忆里</h1></header>
      <img class="cover-art" src="assets/cover.jpg" alt="女孩骑着大白鹅，飞过河流、桥和小镇" draggable="false">
      <p id="preload-status" class="preload-status" aria-live="polite">正在提前准备回忆，可以上划开始</p>
    </section>
    <section id="road" class="road layer" hidden aria-label="回忆之间的小路">
      <div id="road-scenery" class="road-scenery" aria-hidden="true"><img id="chapter-map-image" class="chapter-map-image" alt="" hidden draggable="false">
        <div class="sunlight"></div>
        <svg class="road-drawing" viewBox="0 0 400 800" preserveAspectRatio="none" fill="none">
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#e3d9ed" stroke-width="114"/>
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#f8f3e9" stroke-width="100"/>
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#dacae2" stroke-width="1.5" stroke-dasharray="2 12"/>
          <path d="M55 440l4-16 5 16M340 660l4-16 5 16M73 275l3-12 5 12M330 190l4-12 5 12" stroke="#b9b5a1" stroke-width="2" stroke-linecap="round"/>
          <circle cx="53" cy="415" r="4" fill="#d7c3e7"/><circle cx="345" cy="633" r="4" fill="#d7c3e7"/>
        </svg>
      </div>
      <header class="road-heading"><p>乘风去往回忆里</p><h2 id="road-title">沿着日子，慢慢走</h2></header>
      <div id="beacon" class="beacon" aria-hidden="true"><span class="beacon-halo"></span><svg viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="beacon-gold"><stop stop-color="#fffef3"/><stop offset=".55" stop-color="#fff0b4"/><stop offset="1" stop-color="#eac06b"/></radialGradient></defs><path d="M30 5C32 23 37 28 55 30C37 32 32 37 30 55C28 37 23 32 5 30C23 28 28 23 30 5Z" fill="url(#beacon-gold)" stroke="#bf934b" stroke-width="1.5"/></svg><span class="node-sparkle node-sparkle-a" aria-hidden="true"></span><span class="node-sparkle node-sparkle-b" aria-hidden="true"></span><span class="node-sparkle node-sparkle-c" aria-hidden="true"></span></div>
      <div id="character-box" class="character-box"><img id="character" src="assets/idle.png" alt="淡紫色上衣、深色长裤的小姑娘" draggable="false"></div>
      <div id="bag-glow" class="bag-glow" aria-hidden="true"></div>
      <img id="flying-badge" class="flying-badge" src="assets/badminton-badge.png" alt="羽毛球纪念勋章" hidden draggable="false">
      <p id="road-copy" class="road-copy">每一小步，都离回忆近一点。</p>
    </section>
    <section id="story" class="story layer" hidden aria-label="回忆分镜">
      <div id="story-wash" class="story-wash" aria-hidden="true"></div>
      <header class="story-heading"><p id="story-title">记忆里的时光</p><span id="panel-number">01 / 04</span></header>
      <div class="panel-art"><img id="panel-image" alt="羽毛球分镜" draggable="false"><video id="panel-video" class="panel-video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" hidden></video><button id="play-finale-video" class="play-finale-video" type="button" data-ui hidden>轻触播放画面</button></div>
      <div class="caption-wrap"><p id="caption" class="caption"></p></div>
    </section>
    <div id="finale-overlay" class="finale-overlay" hidden aria-label="收藏的回忆勋章"></div>
    <section id="branch-choice" class="branch-choice" hidden aria-labelledby="branch-title">
      <div class="branch-card"><p class="branch-eyebrow">夜深了，留一点时间给自己</p><h2 id="branch-title">如果今天，可以早点下班呢？</h2>
        <button id="choose-if" type="button">走进童年的回忆</button><button id="choose-reality" type="button">继续现实中的这一晚</button>
      </div>
    </section>
    <p id="gesture-hint" class="gesture-hint"><span class="gesture-arrow" aria-hidden="true">⌃</span><span id="hint-copy">手指向上划，开启回忆</span></p>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <div id="asset-error" class="asset-error" role="alert" hidden>这张回忆暂时未能载入。<button id="retry-assets" type="button" data-ui>重试加载</button></div>
    <aside id="debug" class="debug" hidden><output id="debug-state"></output><button id="reset" type="button">重置进度</button></aside>
    <aside class="audio-controls" data-ui data-audio-controls aria-label="声音控制">
      <button id="audio-toggle" class="audio-toggle" type="button" aria-label="打开声音设置" aria-expanded="false" aria-controls="audio-panel"><span aria-hidden="true">♫</span></button>
      <section id="audio-panel" class="audio-panel" hidden aria-label="音量设置">
        <button id="audio-mute" type="button" aria-pressed="false">静音全部声音</button>
        <label for="audio-sfx-volume">音效 <output id="audio-sfx-value">80%</output></label><input id="audio-sfx-volume" type="range" min="0" max="100" value="80" aria-label="音效音量">
        <label for="audio-bgm-volume">背景音乐 <output id="audio-bgm-value">22%</output></label><input id="audio-bgm-volume" type="range" min="0" max="100" value="22" aria-label="背景音乐音量" disabled>
        <p id="audio-note">轻触声音按钮开启声音。</p>
      </section>
    </aside>
    <noscript><p class="asset-error">请开启 JavaScript，以翻阅这本互动绘本。</p></noscript>
  </main>
  <div id="chapter-transition" class="chapter-transition" hidden aria-hidden="true"></div>
  <script type="importmap">
{
  "imports": {
    "./src/journey.js": "./src/journey.js?v=21",
    "./src/journey-data.js": "./src/journey-data.js?v=21",
    "./src/journey-state.js": "./src/journey-state.js?v=21",
    "./src/finale.js": "./src/finale.js?v=21",
    "./src/finale-video.js": "./src/finale-video.js?v=21",
    "./src/input.js": "./src/input.js?v=21",
    "./src/badge-animation.js": "./src/badge-animation.js?v=21",
    "./src/badge-presentation.js": "./src/badge-presentation.js?v=21",
    "./src/audio-system.js": "./src/audio-system.js?v=21",
    "./src/audio-config.js": "./src/audio-config.js?v=21",
    "./src/audio-controls.js": "./src/audio-controls.js?v=21",
    "./src/bgm-player.js": "./src/bgm-player.js?v=21",
    "./src/music-manager.js": "./src/music-manager.js?v=21",
    "./src/music-config.js": "./src/music-config.js?v=21",
    "./src/asset-loader.js": "./src/asset-loader.js?v=21",
    "./src/chapter-config.js": "./src/chapter-config.js?v=21",
    "./src/chapter-road.js": "./src/chapter-road.js?v=21",
    "./src/chapter-transition.js": "./src/chapter-transition.js?v=21",
    "./src/retire-offline.js": "./src/retire-offline.js?v=21"
  }
}
</script>
  <script type="module" src="src/main.js?v=21"></script>
</body>
</html>
