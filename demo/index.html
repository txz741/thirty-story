<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3edf7">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="乘风去往回忆里：滑动翻阅一段关于羽毛球的快乐回忆。">
  <title>乘风去往回忆里 · 交互样片</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="assets/cover.jpg" as="image">
</head>
<body>
  <main id="book" class="book" aria-label="乘风去往回忆里，滑动翻页绘本">
    <section id="cover" class="cover layer">
      <div class="cover-wash" aria-hidden="true"></div>
      <header class="cover-heading"><p>一本关于日子与回忆的绘本</p><h1>乘风去往回忆里</h1></header>
      <img class="cover-art" src="assets/cover.jpg" alt="女孩骑着大白鹅，飞过河流、桥和小镇" draggable="false">
    </section>
    <section id="road" class="road layer" hidden aria-label="回忆之间的小路">
      <div id="road-scenery" class="road-scenery" aria-hidden="true">
        <div class="sunlight"></div>
        <svg class="road-drawing" viewBox="0 0 400 800" preserveAspectRatio="none" fill="none">
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#e3d9ed" stroke-width="114"/>
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#f8f3e9" stroke-width="100"/>
          <path d="M115 880C110 720 307 699 271 545C247 442 181 428 212 320C242 219 315 175 283 83C269 44 252 12 249-50" stroke="#dacae2" stroke-width="1.5" stroke-dasharray="2 12"/>
          <path d="M55 440l4-16 5 16M340 660l4-16 5 16M73 275l3-12 5 12M330 190l4-12 5 12" stroke="#b9b5a1" stroke-width="2" stroke-linecap="round"/>
          <circle cx="53" cy="415" r="4" fill="#d7c3e7"/><circle cx="345" cy="633" r="4" fill="#d7c3e7"/>
        </svg>
      </div>
      <header class="road-heading"><p>乘风去往回忆里</p><h2 id="road-title">沿着日子，慢慢走</h2></header>
      <div id="beacon" class="beacon" aria-hidden="true"><span class="beacon-halo"></span><svg viewBox="0 0 60 60"><path d="M30 5C32 23 37 28 55 30C37 32 32 37 30 55C28 37 23 32 5 30C23 28 28 23 30 5Z" fill="#fff3c2" stroke="#dab476" stroke-width="1"/></svg></div>
      <div id="character-box" class="character-box"><img id="character" src="assets/idle.png" alt="淡紫色上衣、深色长裤的小姑娘" draggable="false"></div>
      <div id="bag-glow" class="bag-glow" aria-hidden="true"></div>
      <img id="flying-badge" class="flying-badge" src="assets/badminton-badge.png" alt="羽毛球纪念勋章" hidden draggable="false">
      <p id="road-copy" class="road-copy">每一小步，都离回忆近一点。</p>
    </section>
    <section id="story" class="story layer" hidden aria-label="羽毛球回忆分镜">
      <div id="story-wash" class="story-wash" aria-hidden="true"></div>
      <header class="story-heading"><p>记忆里的羽毛球场</p><span id="panel-number">01 / 04</span></header>
      <div class="panel-art"><img id="panel-image" alt="羽毛球分镜" draggable="false"></div>
      <div class="caption-wrap"><p id="caption" class="caption"></p></div>
    </section>
    <p id="gesture-hint" class="gesture-hint"><span class="down-mark" aria-hidden="true">⌄</span><span id="hint-copy">手指向下划，开启回忆</span></p>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <div id="asset-error" class="asset-error" role="alert" hidden>这张回忆暂时未能载入，请刷新重试。</div>
    <aside id="debug" class="debug" hidden><output id="debug-state"></output><button id="reset" type="button">重置进度</button></aside>
    <noscript><p class="asset-error">请开启 JavaScript，以翻阅这本互动绘本。</p></noscript>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
