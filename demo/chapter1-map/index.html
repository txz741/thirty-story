function createChapter1PoseLoader({baseURL,poses,Image=globalThis.Image,timeoutMs=20000,setTimeout=globalThis.setTimeout,clearTimeout=globalThis.clearTimeout}){
  const cache=new Map();
  function load(name,{priority='high'}={}){
    const existing=cache.get(name);
    if(existing){if(priority==='high')existing.image.fetchPriority='high';return existing.promise;}
    const image=new Image();image.decoding='async';image.fetchPriority=priority;
    const entry={image,ready:false,promise:null};let settled=false,timer;
    entry.promise=new Promise(resolve=>{
      const finish=ok=>{if(settled)return;settled=true;clearTimeout(timer);image.onload=null;image.onerror=null;entry.ready=ok;if(!ok&&cache.get(name)===entry)cache.delete(name);resolve(ok);};
      image.onload=async()=>{try{if(image.decode)await image.decode();finish(true);}catch{finish(false);}};
      image.onerror=()=>finish(false);timer=setTimeout(()=>finish(false),timeoutMs);
    });
    cache.set(name,entry);
    try{image.src=baseURL+poses[name];}catch{image.onerror();}
    return entry.promise;
  }
  async function prepare(names){return (await Promise.all([...new Set(names)].map(name=>load(name)))).every(Boolean);}
  async function warm(names){let next=0;await Promise.all([0,1].map(async()=>{while(next<names.length)await load(names[next++],{priority:'low'});}));}
  return {prepare,warm,isReady:names=>names.every(name=>cache.get(name)?.ready)};
}

    marker.style.top=((frame.scene.marker.y-frame.cameraY)/layout.viewport.height*100)+'%';
    marker.dataset.side=frame.scene.side;
    $('event').textContent=frame.arrived?frame.scene.title:step===0?'回忆还在前方':step%4===1&&step>4?'把刚才的回忆留在身后':'沿着日子，慢慢走';
    $('beat').textContent=frame.beat;
    $('status').textContent=`${String(step).padStart(2,'0')} / ${layout.lastStep} 步 · ${frame.beat}`;
    $('coordinate').textContent=`镜头 ${frame.cameraY}px · ${frame.scene.title}在${frame.scene.side==='left'?'左':'右'}侧`;
    $('position').value=step;$('previous').disabled=step===0;$('next').disabled=step===layout.lastStep;
    $('direction').textContent=frame.arrived?`疑惑立绘看${side==='left'?'左':'右'} · 节点在${frame.scene.side==='left'?'左':'右'}`:'上滑前进 · 下滑回看';
    for(const button of document.querySelectorAll('[data-step]'))button.classList.toggle('selected',Number(button.dataset.step)===step);
  }
  async function go(target,animate=true){
    const next=Math.max(0,Math.min(layout.lastStep,target));
    if(next===step)return;
    if(busy){queued=Math.sign(next-step);return;}
    if(!animate){step=next;map.style.transition='none';paint();return;}
    const token=++generation;busy=true;
    const destination=chapter1Frame(next,layout),selected=$('pose').value;
    const required=['idle','stepLeft','stepRight',selected==='auto'?destination.pose:selected];
    if(!poseLoader.isReady(required)){$('status').textContent='正在准备迈步动作…';$('direction').textContent='首次需要加载动作图片，准备好后会继续走';}
    const ready=await poseLoader.prepare(required);
    if(token!==generation)return;
    if(!ready){busy=false;queued=0;paint();$('status').textContent='动作图片暂未载入，请点击“走一步”重试。';return;}
    step=next;walkingNow=true;
    map.style.transition=reduce?'none':'transform .92s cubic-bezier(.3,.1,.25,1)';
    paint(true);
    const beat=reduce?100:230;
    later(()=>setPose('idle'),beat);
    later(()=>setPose('stepRight'),beat*2);
    later(()=>setPose('idle'),beat*3);
    later(()=>{busy=false;walkingNow=false;paint();if(queued){const direction=queued;queued=0;void go(step+direction);}},beat*4+20);
  }
  $('next').onclick=()=>go(step+1);$('previous').onclick=()=>go(step-1);
  $('reset').onclick=()=>{clear();queued=0;step=0;map.style.transition='none';paint();};
  $('position').oninput=event=>{clear();queued=0;go(Number(event.target.value),false);};
  for(const id of ['pose','facing','show-girl','show-marker'])$(id).onchange=()=>{clear();queued=0;paint();};
  for(const button of document.querySelectorAll('[data-step]'))button.onclick=()=>{clear();queued=0;go(Number(button.dataset.step),false);};
  stage.addEventListener('pointerdown',event=>{pointer={id:event.pointerId,x:event.clientX,y:event.clientY};try{stage.setPointerCapture?.(event.pointerId);}catch{}});
  stage.addEventListener('pointerup',event=>{if(!pointer||pointer.id!==event.pointerId)return;const dy=event.clientY-pointer.y,dx=event.clientX-pointer.x;pointer=null;if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)*1.2)go(step+(dy<0?1:-1));});
  stage.addEventListener('pointercancel',()=>{pointer=null;});
  stage.addEventListener('wheel',event=>{event.preventDefault();const now=Date.now();if(now-wheelAt>200)wheel=0;wheelAt=now;wheel+=event.deltaY;if(Math.abs(wheel)>45){go(step+(wheel>0?1:-1));wheel=0;}},{passive:false});
  addEventListener('keydown',event=>{if(/INPUT|SELECT|BUTTON/.test(event.target.tagName))return;if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){event.preventDefault();go(step+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1));}});
  addEventListener('resize',()=>{map.style.transition='none';paint();});
  map.addEventListener('error',()=>{$('status').textContent='长图暂时未能载入，请保持联网后刷新重试。';});
  window.chapter1Preview={go:step=>{clear();queued=0;go(step,false);},get frame(){return chapter1Frame(step,layout);}};
  paint();
  void poseLoader.warm(['stepLeft','stepRight','curious']);
})();
</script></body></html>
